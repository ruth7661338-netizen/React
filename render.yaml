services:
  - type: web
    name: math-games-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TEACHER_CODE
        sync: false
      - key: CLIENT_URL
        sync: false